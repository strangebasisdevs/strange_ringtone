version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # "chore(deps): bump ..." passes the PR-title check, and release-please
    # leaves chores out of the CHANGELOG.
    commit-message:
      prefix: chore
      include: scope

  # The hashed pip-compile lockfile (requirements.in -> requirements.txt) for ruff.
  # Semgrep and Trivy versions live in strange_security, whose own Dependabot
  # keeps them current.
  - package-ecosystem: pip
    directory: /.github/lint
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  # core/Dockerfile's base images, pinned by digest. The FFmpeg source tarball
  # is not something Dependabot can see; ffmpeg-watch.yml covers it.
  - package-ecosystem: docker
    directory: /core
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The core targets Python 3.12 (CLAUDE.md), so only the digest of the
      # 3.12 tag moves; a newer Python is a decision, not a bump.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
