version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # "chore(deps): bump ..." passes the PR-title check, and release-please
    # leaves chores out of the CHANGELOG.
    commit-message:
      prefix: chore
      include: scope

  # The hashed pip-compile lockfile (requirements.in -> requirements.txt) for ruff.
  # Semgrep and Trivy versions live in strange_security, whose own Dependabot
  # keeps them current.
  - package-ecosystem: pip
    directory: /.github/lint
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  # core/Dockerfile's base images, pinned by digest. The FFmpeg source tarball
  # is not something Dependabot can see; ffmpeg-watch.yml covers it.
  - package-ecosystem: docker
    directory: /core
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The core targets Python 3.12 (CLAUDE.md), so only the digest of the
      # 3.12 tag moves; a newer Python is a decision, not a bump.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # The fetcher's hashed pip-compile lockfile (fetcher/requirements.in ->
  # requirements.txt). One group, so yt-dlp and the yt-dlp-ejs version it
  # pins move in one PR; the in-image tests fail if they ever disagree.
  - package-ecosystem: pip
    directory: /fetcher
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      ytdlp:
        patterns:
          - yt-dlp
          - yt-dlp-ejs

  # fetcher/Dockerfile's base images, pinned by digest: the Python base it
  # shares with the core and the named Deno stage.
  - package-ecosystem: docker
    directory: /fetcher
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Python 3.12 only (CLAUDE.md), as for the core.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
