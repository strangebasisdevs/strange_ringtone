version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # "chore(deps): bump ..." passes the PR-title check, and release-please
    # leaves chores out of the CHANGELOG.
    commit-message:
      prefix: chore
      include: scope

  # The hashed pip-compile lockfile (requirements.in -> requirements.txt) for ruff.
  # Semgrep and Trivy versions live in strange_security, whose own Dependabot
  # keeps them current.
  - package-ecosystem: pip
    directory: /.github/lint
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  # The docker ecosystem (base images by digest) is added with the first
  # Dockerfile, in the render milestone.
