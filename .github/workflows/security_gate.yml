name: Security gate

# Every security scan comes from the organisation's shared security repository;
# this repository runs none of its own. They are pinned by full commit SHA with
# a version comment and bumped by Dependabot (CLAUDE.md, Supply chain).
on:
  pull_request:
  push:
    branches:
      - main

# security-events: write lets the shared workflows upload SARIF to code scanning.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep
    uses: strangebasisdevs/strange_security/.github/workflows/semgrep.yml@26c089bb86b845fac6e3417c24469bef6bf9a713 # v1.0.0

  trivy:
    name: Trivy
    uses: strangebasisdevs/strange_security/.github/workflows/trivy.yml@26c089bb86b845fac6e3417c24469bef6bf9a713 # v1.0.0

  gitleaks:
    name: Gitleaks
    uses: strangebasisdevs/strange_security/.github/workflows/gitleaks.yml@26c089bb86b845fac6e3417c24469bef6bf9a713 # v1.0.0
