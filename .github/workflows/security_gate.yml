name: Security gate

# Every security scan comes from the organisation's shared security repository;
# this repository runs none of its own. These are referenced at @main, the
# owner's explicit exception (2026-10-25) to pinning by commit SHA. It applies
# only to strangebasisdevs-owned reusable workflows, so a fix made there reaches
# every repository at once (CLAUDE.md, Supply chain).
on:
  pull_request:
  push:
    branches:
      - main

# security-events: write lets the shared workflows upload SARIF to code scanning.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep
    uses: strangebasisdevs/strange_security/.github/workflows/semgrep.yml@main

  trivy:
    name: Trivy
    uses: strangebasisdevs/strange_security/.github/workflows/trivy.yml@main

  gitleaks:
    name: Gitleaks
    uses: strangebasisdevs/strange_security/.github/workflows/gitleaks.yml@main
